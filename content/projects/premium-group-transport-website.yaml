summary: Premium group travel that finally looks premium. A B2C-first redesign — cleaner, more confident — engineered to turn visitors into WhatsApp bookings.
challenge: The brand offered a premium group-travel service, but its website didn't reflect that positioning — and lacked a clear path from visit to booking for individual (B2C) customers.
solution: |-
  The redesign strengthens the brand's positioning and guides visitors toward a clear WhatsApp booking flow, while improving readability and SEO across the whole site.

  Built by modifying the existing WordPress theme rather than rebuilding from scratch, keeping the brand's history intact.
