overview: |-
  A WhatsApp sales automation system built to answer prospect chats automatically around the clock — no manual standby required. The bot acts as a friendly, natural first responder: uncovering needs, recommending the right package, and steering prospects toward a consultation, while keeping the owner in full control of the final decision.

  Designed on an anti-hallucination principle: every answer — prices, services, policies — is drawn from real data sources, not invented. The bot also has firm topic boundaries — focused on the services, politely refusing out-of-context questions.
features:
  - 💬 Auto-replies to WhatsApp chats 24/7 in a natural conversational tone
  - 🧠 AI agent with permanent conversation memory (remembers each customer's context)
  - 📚 Knowledge base (RAG) + price database — accurate, grounded answers
  - 📅 Automatic meeting booking synced to Google Calendar
  - 🔔 Hot-lead notifications sent straight to the owner's WhatsApp
  - ⏸️ Auto-handover — the bot steps aside the moment the owner takes over a chat
  - 🛡️ Anti-hallucination & strict topic scoping
role: Architecture design, system integration, and end-to-end implementation.
