summary: A B2B ordering portal that turns resellers into a loyal community. They browse the catalog, place orders, and track shipments and payments end to end — while points, tiers, leaderboards, and rewards keep them coming back.
challenge: |-
  The reseller network was managed through spreadsheets and manual communication, which made ordering, shipment, and payment tracking hard to scale.

  Resellers also had little reason to stay engaged beyond the next order.
solution: |-
  Built as a split web + API architecture with a full admin back office for catalog, access control, and reseller management.

  Designed to scale a reseller network with structure instead of spreadsheets.
