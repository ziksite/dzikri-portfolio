summary: Purchasing decisions backed by data, not gut feel. Synced hourly to the warehouse system, it forecasts demand, flags stockouts and overstock before they happen, and recommends exactly what to reorder — and when.
challenge: |-
  Purchasing relied on gut feel even though the warehouse system already held the data.

  Without forecasts or alerts, stockouts and overstock were only noticed after they had already happened.
solution: |-
  Under the hood: reorder-point and EOQ calculators, ABC classification, true-COGS building, and a supplier scorecard, with automated email and WhatsApp alerts.

  Turns data that already existed into purchasing decisions that finally use it.
