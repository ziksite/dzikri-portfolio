summary: Find your next room in seconds. A rental platform for boarding houses and apartments with per-room pricing, real-time availability, and a WhatsApp flow that closes the gap between browsing and booking.
challenge: Prospective tenants had to ask one by one about prices and availability across several locations, which slowed the path from browsing to booking.
solution: |-
  Each room shows its own specifications, price range, and real-time availability status, with a waiting-list and inquiry flow that hands off to WhatsApp for follow-up.

  Designed around a clear order flow and availability database so prospective tenants can quickly find and ask about the right unit.
