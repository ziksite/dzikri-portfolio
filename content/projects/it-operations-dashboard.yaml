summary: Two companies, one IT team, zero lost tickets. An internal dashboard that turns scattered WhatsApp requests into tracked tickets and tasks — with clear visibility into team capacity.
challenge: |-
  One IT team supported two companies through WhatsApp messages and verbal briefs.

  Requests went untracked, support work and development work collided, and there was no clear view of the team's capacity.
solution: |-
  It replaces untracked WhatsApp requests and verbal briefs with a structured ticketing and task system, giving the team clear visibility into workload, priorities, and performance.

  Designed around a priority system that keeps support requests and development work from colliding.
